# Everything in one command:   docker compose up --build
#   MVC web app  -> http://localhost:5090
#   API/Swagger  -> http://localhost:5080/swagger
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RaceDay_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"

  api:
    build: ./RaceDay.Api
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql;Database=RaceDayDB;User Id=sa;Password=RaceDay_Passw0rd!;TrustServerCertificate=True"
      Jwt__Key: "docker-compose-demo-key-change-me-at-least-32-chars!"
      # Azurite's well-known development account (public, not a real secret).
      BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # The API talks to "azurite", but the browser must use localhost to load the images.
      BlobStorage__PublicBaseUrl: "http://localhost:10000/devstoreaccount1"
    ports:
      - "5080:8080"

  web:
    build: ./RaceDay.Web
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "5090:8080"
